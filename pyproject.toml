[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dppmadera"
version = "0.1.0"
description = "Proof of concept: federated digital product passport for industrialised timber construction (synthetic data)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2.5", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
